<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coogles · Rust history</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #11151d; color: #e8edf5 }
body { max-width: 1100px; margin: 32px auto; padding: 0 20px }
h1 { margin-bottom: 8px } p { color: #aebcd0; line-height: 1.5 }
#controls { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0 }
label { cursor: pointer } input { margin-right: 8px }
svg { width: 100%; background: #191f2b; border-radius: 12px }
text { fill: #aebcd0; font-size: 13px }
.grid { stroke: #344056; stroke-width: 1 }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums }
th, td { padding: 10px; border-bottom: 1px solid #344056; text-align: right }
th:first-child, td:first-child { text-align: left }
.scroll { overflow-x: auto } #detail { min-height: 1.5em }
button { background: #27354b; color: #e8edf5; border: 0; border-radius: 6px; padding: 9px 14px; cursor: pointer }
</style>
<h1>Coogles</h1>
<p id="summary"></p>
<div id="controls"></div>
<svg id="plot" viewBox="0 0 1000 800" role="img" aria-label="Rust line counts over sampled Git history"></svg>
<p id="detail">Hover or focus a point for its commit and counts.</p>
<button id="download">Download JSON</button>
<p id="warning"></p>
<div class="scroll"><table><thead><tr><th>Commit · offset</th><th>Code (total)</th><th>Tests</th><th>// comments</th><th>Docs</th><th>Examples</th></tr></thead><tbody id="rows"></tbody></table></div>
<details><summary>Counting rules</summary><p id="definitions"></p></details>
<script type="application/json" id="report">__REPORT_JSON__</script>
<script>
const report = JSON.parse(document.getElementById('report').textContent)
const snapshots = [...report.snapshots].reverse()
const series = [
  { key: 'code_loc', name: 'Code (total)', color: '#ff879c' },
  { key: 'test_code_loc', name: 'Tests', color: '#69c7ff' },
  { key: 'comment_loc', name: '// comments', color: '#ffc56a' },
  { key: 'doc_loc', name: 'Docs (//! + ///)', color: '#ba9aff' },
  { key: 'example_code_loc', name: 'Examples', color: '#67dfa6' }
]
const enabled = new Set(series.map(item => item.key))
const svg = document.getElementById('plot')
const namespace = 'http://www.w3.org/2000/svg'
function element(tag, attributes, text) {
  const node = document.createElementNS(namespace, tag)
  for (const [name, value] of Object.entries(attributes)) node.setAttribute(name, value)
  if (text !== undefined) node.textContent = text
  return node
}
function describe(snapshot) {
  return `${snapshot.commit.slice(0, 10)} · HEAD~${snapshot.offset} · ${new Date(snapshot.timestamp * 1000).toISOString().slice(0, 10)} · ` +
    series.map(item => `${item.name}: ${snapshot.metrics[item.key].toLocaleString()}`).join(' · ')
}
function draw() {
  svg.replaceChildren()
  const visible = series.filter(item => enabled.has(item.key))
  const values = snapshots.flatMap(snapshot => visible.map(item => snapshot.metrics[item.key]))
  const maximum = Math.max(1, ...values) * 1.1
  const oldest = snapshots[0].offset
  const newest = snapshots[snapshots.length - 1].offset
  const positionX = snapshot => oldest === newest ? 530 : 80 + (oldest - snapshot.offset) / (oldest - newest) * 860
  const positionY = value => 720 - value / maximum * 680
  for (let index = 0; index <= 8; index++) {
    const value = maximum * index / 8
    const height = positionY(value)
    svg.append(element('line', { x1: 80, x2: 940, y1: height, y2: height, class: 'grid' }))
    svg.append(element('text', { x: 70, y: height + 4, 'text-anchor': 'end' }, Math.round(value).toLocaleString()))
  }
  const labelEvery = Math.max(1, Math.ceil(snapshots.length / 10))
  snapshots.forEach((snapshot, index) => {
    if (index % labelEvery === 0 || index === snapshots.length - 1) {
      svg.append(element('text', { x: positionX(snapshot), y: 749, 'text-anchor': 'middle' }, `~${snapshot.offset}`))
    }
  })
  svg.append(element('text', { x: 510, y: 782, 'text-anchor': 'middle' }, 'First-parent commit offset from HEAD · oldest to newest'))
  for (const item of visible) {
    const points = snapshots.map(snapshot => `${positionX(snapshot)},${positionY(snapshot.metrics[item.key])}`).join(' ')
    svg.append(element('polyline', { points, fill: 'none', stroke: item.color, 'stroke-width': 2.5 }))
    for (const snapshot of snapshots) {
      const circle = element('circle', { cx: positionX(snapshot), cy: positionY(snapshot.metrics[item.key]), r: 5, fill: item.color, tabindex: 0, 'aria-label': describe(snapshot) })
      circle.append(element('title', {}, describe(snapshot)))
      const show = () => { document.getElementById('detail').textContent = describe(snapshot) }
      circle.addEventListener('mouseenter', show)
      circle.addEventListener('focus', show)
      svg.append(circle)
    }
  }
}
for (const item of series) {
  const label = document.createElement('label')
  label.style.color = item.color
  const checkbox = document.createElement('input')
  checkbox.type = 'checkbox'
  checkbox.checked = true
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) enabled.add(item.key)
    else enabled.delete(item.key)
    draw()
  })
  label.append(checkbox, document.createTextNode(item.name))
  document.getElementById('controls').append(label)
}
document.getElementById('summary').textContent = `${report.repository} · ${snapshots.length} stops · ${report.unique_rust_blobs.toLocaleString()} unique Rust file versions · ${report.elapsed_seconds.toFixed(2)}s`
document.getElementById('definitions').textContent = report.definitions
const failures = snapshots.reduce((total, snapshot) => total + snapshot.parse_errors.length, 0)
const warnings = []
if (report.configuration.history_truncated) warnings.push(`Requested ${report.configuration.requested_commits} commits, but only ${report.configuration.commits} first-parent edges are available. Sampled the available history.`)
if (report.configuration.shallow_boundary) warnings.push('Reached a shallow clone boundary. Deepen the clone to include older history.')
warnings.push(failures ? `${failures} file/snapshot parse failures. Inline test counts may be incomplete. Details are in the JSON.` : 'All sampled Rust files parsed successfully.')
document.getElementById('warning').textContent = warnings.join(' ')
for (const snapshot of snapshots) {
  const row = document.createElement('tr')
  for (const value of [`${snapshot.commit.slice(0, 10)} · ~${snapshot.offset}`, ...series.map(item => snapshot.metrics[item.key].toLocaleString())]) {
    const cell = document.createElement('td')
    cell.textContent = value
    row.append(cell)
  }
  document.getElementById('rows').append(row)
}
document.getElementById('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], { type: 'application/json' }))
  const link = document.createElement('a')
  link.href = url
  link.download = 'report.json'
  link.click()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
})
draw()
</script>
</html>
