<script>
const reportDocument = JSON.parse(document.getElementById('report').textContent)
const reports = reportDocument.repositories || [reportDocument]
const preferences = (() => {
  try {
    const saved = JSON.parse(localStorage.getItem('coogles.preferences') || '{}')

  } catch { return {} }
})()
for (const [identifier, key] of [['hide-tables', 'hideTables'], ['percentage-mode', 'percentageMode'], ['compact-mode', 'compactMode'], ['hide-points', 'hidePoints']]) {
  if (typeof preferences[key] === 'boolean') document.getElementById(identifier).checked = preferences[key]
}
if (typeof preferences.hideTables !== 'boolean') {
  try {
    const saved = localStorage.getItem('coogles.hideTables')
    if (saved !== null) document.getElementById('hide-tables').checked = saved === 'true'
  } catch {}
}
if (['commits', 'time-1week', 'time', 'time-4weeks'].includes(preferences.axisMode)) {
  document.getElementById('axis-mode').value = preferences.axisMode
}
const series = [
  { key: 'code_loc', name: 'Code (total)', color: '#ff879c' },
  { key: 'source_code_loc', name: 'Source code', color: '#f0eb83' },
  { key: 'test_code_loc', name: 'Tests', color: '#69c7ff' },
  { key: 'comment_loc', name: '// comments', color: '#ffc56a' },
  { key: 'doc_loc', name: 'Docs (//! + ///)', color: '#ba9aff' },
  { key: 'example_code_loc', name: 'Examples', color: '#67dfa6' }

const enabled = new Set(series.filter(item => !Array.isArray(preferences.enabledSeries) || preferences.enabledSeries.includes(item.key)).map(item => item.key))
function timestampMonth(timestamp) {

const months = reports.flatMap(report => report.snapshots.map(snapshot => timestampMonth(snapshot.timestamp)))

const startMonthInput = document.getElementById('start-month')
const endMonthInput = document.getElementById('end-month')

}
startMonthInput.value = '0'
endMonthInput.value = String(monthCount)
let rangePreset = [0, 2, 6, 12, 24].includes(preferences.rangePreset) ? preferences.rangePreset : null
const savedRange = preferences.dateRange

  startMonthInput.value = String(rangePreset ? Math.max(0, monthCount - rangePreset + 1) : 0)

}
function savePreferences() {

      percentageMode: document.getElementById('percentage-mode').checked,
      compactMode: document.getElementById('compact-mode').checked,
      hidePoints: document.getElementById('hide-points').checked,
      hideTables: document.getElementById('hide-tables').checked,

}
function updateDateRange(changed) {

  let end = Number(endMonthInput.value)

    if (changed === 'start-month') {
      end = start
      endMonthInput.value = String(end)
    } else {
      start = end
      startMonthInput.value = String(start)
    }
  }
  const startLabel = formatMonth(firstMonth + start)
  const endLabel = formatMonth(firstMonth + end)
  document.getElementById('start-month-label').textContent = startLabel
  document.getElementById('end-month-label').textContent = endLabel
  startMonthInput.setAttribute('aria-valuetext', startLabel)
  endMonthInput.setAttribute('aria-valuetext', endLabel)

updateDateRange()
const namespace = 'http://www.w3.org/2000/svg'
function element(tag, attributes, text) {
  const node = document.createElementNS(namespace, tag)

  return node
}
function renderRepository(report, index) {
  const section = document.createElement('section')
  section.id = `repository-${index}`
  section.innerHTML = document.getElementById('repository-template').innerHTML

  const getElement = identifier => section.querySelector(`[data-element="${identifier}"]`)
  const parts = report.repository.split('/').filter(Boolean)
  const dataIndex = parts.lastIndexOf('data')
  const inferredUrl = dataIndex >= 0 && parts.length >= dataIndex + 3 ? `https://github.com/${parts[dataIndex + 1]}/${parts[dataIndex + 2]}` : null
  const repositoryUrl = report.repository_url || inferredUrl
  const repositoryName = repositoryUrl ? repositoryUrl.split('/').slice(-2).join('/') : (parts[parts.length - 1] === 'trunk' ? parts[parts.length - 2] : parts[parts.length - 1])
  const link = document.createElement('a')
  link.textContent = repositoryName
  link.href = `#${section.id}`
  link.title = report.repository
  const entry = document.createElement('li')
  entry.append(link)
  document.getElementById('repository-links').append(entry)
  if (repositoryUrl) {
    getElement('heading').textContent = repositoryName
    getElement('heading').href = repositoryUrl
  } else {
    getElement('heading').textContent = repositoryName
  }
  const allSnapshots = [...report.snapshots].reverse()
  let snapshots = allSnapshots
  const svg = getElement('plot')
  function metricValue(snapshot, key) {
    if (!document.getElementById('percentage-mode').checked) return snapshot.metrics[key]
    return snapshot.metrics.code_loc > 0 ? snapshot.metrics[key] / snapshot.metrics.code_loc * 100 : 0
  }
  function formatMetric(snapshot, key) {
    if (!document.getElementById('percentage-mode').checked) return snapshot.metrics[key].toLocaleString()
    return snapshot.metrics.code_loc > 0 ? `${metricValue(snapshot, key).toLocaleString(undefined, { maximumFractionDigits: 1 })}%` : 'N/A'
  }

    const plotBottom = graphHeight - 80

    const visible = series.filter(item => enabled.has(item.key))
    const percentageMode = document.getElementById('percentage-mode').checked
    const hidePoints = document.getElementById('hide-points').checked
    const values = snapshots.flatMap(snapshot => visible.map(item => metricValue(snapshot, item.key)))
    const highest = Math.max(0, ...values)

    const maximum = percentageMode ? Math.max(percentageStep, Math.ceil(highest / percentageStep) * percentageStep) : Math.max(1, highest) * 1.1

        svg.append(grid)
        if (ticks.length >= 2 && index % labelEvery === 0) {

        }

      if (ticks.length < 2) {
        for (const timestamp of new Set([earliest, latest])) {

        }
      }
    } else {
      const labelEvery = Math.max(1, Math.ceil(plotted.length / 10))
      plotted.forEach((snapshot, index) => {
        if (index % labelEvery === 0 || index === plotted.length - 1) {
          svg.append(element('text', { x: positionX(snapshot), y: plotBottom + 29, 'text-anchor': 'middle' }, `~${snapshot.offset}`))
        }
      })
    }
    const axisTitle = timeMode ? `Commit date (UTC) · every ${weeks === 1 ? 'week' : `${weeks} weeks`}` : 'First-parent commit offset from HEAD · oldest to newest'
    svg.append(element('text', { x: 510, y: graphHeight - 18, 'text-anchor': 'middle' }, axisTitle))
    for (const item of visible) {
      const points = plotted.map(snapshot => `${positionX(snapshot)},${positionY(metricValue(snapshot, item.key))}`).join(' ')
      svg.append(element('polyline', { points, fill: 'none', stroke: item.color, 'stroke-width': 2.5 }))
      for (const snapshot of plotted) {
        const date = new Date(snapshot.timestamp * 1000).toISOString().slice(0, 10)
        const value = `${item.name}: ${formatMetric(snapshot, item.key)} · ${date}`
        const circle = element('circle', { cx: positionX(snapshot), cy: positionY(metricValue(snapshot, item.key)), r: 5, fill: hidePoints ? 'transparent' : item.color, tabindex: 0, 'aria-label': value })
        circle.append(element('title', {}, value))
        const show = () => { getElement('detail').textContent = value }
        const clear = () => { getElement('detail').textContent = '' }
        circle.addEventListener('mouseenter', show)
        circle.addEventListener('mouseleave', clear)
        circle.addEventListener('focus', show)
        circle.addEventListener('blur', clear)

  }

  const manifestFailures = snapshots.reduce((total, snapshot) => total + (snapshot.manifest_errors || []).length, 0)

  if (report.configuration.history_truncated) warnings.push(`Requested ${report.configuration.requested_commits} commits, but only ${report.configuration.commits} first-parent edges are available. Sampled the available history.`)

  if (failures) warnings.push(`${failures} file/snapshot parse failures. Inline test counts may be incomplete. Details are in the JSON.`)
  if (manifestFailures) warnings.push(`${manifestFailures} file/snapshot manifest parse failures. Custom target paths may be incomplete. Details are in the JSON.`)
  getElement('warning').textContent = warnings.join(' ')

    for (const snapshot of snapshots) {
      const row = document.createElement('tr')
      for (const value of [`${snapshot.commit.slice(0, 10)} · ~${snapshot.offset}`, ...series.map(item => formatMetric(snapshot, item.key))]) {
        const cell = document.createElement('td')
        cell.textContent = value
        row.append(cell)
      }

    }
  }
  function refresh() {
    const start = firstMonth + Number(startMonthInput.value)
    const end = firstMonth + Number(endMonthInput.value)
    snapshots = allSnapshots.filter(snapshot => {
      const month = timestampMonth(snapshot.timestamp)
      return month >= start && month <= end
    })
    getElement('summary').textContent = `${snapshots.length} stops · ${report.unique_rust_blobs.toLocaleString()} unique Rust file versions · ${report.elapsed_seconds.toFixed(2)}s`

  }

}
const charts = reports.map(renderRepository)
const refreshPlots = () => charts.forEach(chart => chart.refresh())
for (const item of series) {

}
for (const identifier of ['percentage-mode', 'axis-mode', 'compact-mode', 'hide-points']) {

for (const identifier of ['start-month', 'end-month']) {

  })
}
for (const [label, months] of [['Last 2 months', 2], ['Last 6 months', 6], ['Last 12 months', 12], ['Last 2 years', 24], ['All time', 0]]) {

    refreshPlots()
  })

}

})

</script>
