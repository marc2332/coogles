      const row = document.createElement('tr')
      for (const value of [`${snapshot.commit.slice(0, 10)} · ~${snapshot.offset}`, ...series.map(item => formatMetric(snapshot, item.key))]) {
        const cell = document.createElement('td')
        cell.textContent = value
        row.append(cell)
      }
      rows.append(row)
    }
  }
  function refresh() {
    const start = firstMonth + Number(startMonthInput.value)
    const end = firstMonth + Number(endMonthInput.value)
    snapshots = allSnapshots.filter(snapshot => {
      const month = timestampMonth(snapshot.timestamp)
      return month >= start && month <= end
    })
    getElement('summary').textContent = `${snapshots.length} stops · ${report.unique_rust_blobs.toLocaleString()} unique Rust file versions · ${report.elapsed_seconds.toFixed(2)}s`
    draw()
    drawTable()
    getElement('table').hidden = document.getElementById('hide-tables').checked
  }
  refresh()
  return { refresh, table: getElement('table') }
}
const charts = reports.map(renderRepository)
const refreshPlots = () => charts.forEach(chart => chart.refresh())
for (const item of series) {
  const label = document.createElement('label')
  label.style.color = item.color
  const checkbox = document.createElement('input')
  checkbox.type = 'checkbox'
  checkbox.checked = enabled.has(item.key)
  checkbox.addEventListener('change', () => {
    if (checkbox.checked) enabled.add(item.key)
    else enabled.delete(item.key)
    savePreferences()
    refreshPlots()
  })
  label.append(checkbox, document.createTextNode(item.name))
  document.getElementById('controls').append(label)
}
for (const identifier of ['percentage-mode', 'axis-mode', 'compact-mode', 'hide-points']) {
  document.getElementById(identifier).addEventListener('change', () => {
    savePreferences()
    refreshPlots()
  })
}
for (const identifier of ['start-month', 'end-month']) {
  document.getElementById(identifier).addEventListener('input', () => {
    rangePreset = null
    updateDateRange(identifier)
    savePreferences()
    refreshPlots()
  })
}
for (const [label, months] of [['Last 2 months', 2], ['Last 6 months', 6], ['Last 12 months', 12], ['Last 2 years', 24], ['All time', 0]]) {
  const button = document.createElement('button')
  button.type = 'button'
  button.textContent = label
  button.addEventListener('click', () => {
    rangePreset = months
    startMonthInput.value = String(months ? Math.max(0, monthCount - months + 1) : 0)
    endMonthInput.value = String(monthCount)
    updateDateRange()
    savePreferences()
    refreshPlots()
  })
  document.getElementById('date-presets').append(button)
}
document.getElementById('hide-tables').addEventListener('change', () => {
  const hidden = document.getElementById('hide-tables').checked
  savePreferences()
  charts.forEach(chart => { chart.table.hidden = hidden })
})
document.getElementById('download').addEventListener('click', () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(reportDocument, null, 2)], { type: 'application/json' }))
  const link = document.createElement('a')
  link.href = url
  link.download = 'report.json'
  link.click()
  setTimeout(() => URL.revokeObjectURL(url), 1000)
})
</script>
